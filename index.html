<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audrey zle</title>
<meta name="description" content="Audrey zle — Communications and Marketing Creative. Get in touch.">

<meta property="og:title" content="Audrey zle">
<meta property="og:description" content="Communications and Marketing Creative — BA by day and Analyst by night.">
<meta property="og:type" content="profile">

<meta name="theme-color" content="#050816">
<meta name="color-scheme" content="dark">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

<style>
  :root{
    --bg:#050816;
    --bg2:#0b1230;
    --panel:rgba(16,24,58,.72);
    --line:rgba(140,170,255,.22);
    --moon:#f4f1e6;
    --orange:#ff7a3d;
    --orange2:#ffb347;
    --cyan:#5ee7ff;
    --text:#e9eeff;
    --dim:#8fa0d0;
    --white:#ffffff;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 18px;
    position:relative;
    overflow-x:hidden;
  }

  /* starfield */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .stars-1{
    background-image: radial-gradient(rgba(255,255,255,0.9) 1px, transparent 1.5px);
    background-size: 140px 140px;
    opacity:.55;
    animation: twinkle1 4s ease-in-out infinite alternate;
  }
  .stars-2{
    background-image: radial-gradient(rgba(94,231,255,0.85) 1px, transparent 1.5px);
    background-size: 90px 90px;
    background-position: 30px 40px;
    opacity:.35;
    animation: twinkle2 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle1{ from{ opacity:.3; } to{ opacity:.65; } }
  @keyframes twinkle2{ from{ opacity:.18; } to{ opacity:.45; } }

  /* moon */
  .moon{
    position:fixed;
    z-index:0;
    pointer-events:none;
    left:-44px;
    top:64px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--moon) 35%, #c9c4b0 100%);
    box-shadow:0 0 60px 10px rgba(244,241,230,.25), 0 0 140px 36px rgba(94,231,255,.12);
    animation: moonFloat 9s ease-in-out infinite;
  }
  .moon i{
    position:absolute;
    border-radius:50%;
    background:rgba(120,115,95,.28);
    box-shadow: inset 2px 2px 3px rgba(0,0,0,.18);
  }
  @keyframes moonFloat{ 50%{ transform: translateY(-14px); } }

  /* planet */
  .planet{
    position:fixed;
    z-index:0;
    pointer-events:none;
    right:-24px;
    bottom:140px;
    width:92px;
    height:92px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #ffd29a, #e0803a 70%);
    animation: planetFloat 11s ease-in-out infinite reverse;
  }
  .planet::after{
    content:"";
    position:absolute;
    left:-36px;
    top:33px;
    width:164px;
    height:22px;
    border:4px solid rgba(255,214,160,.8);
    border-radius:50%;
    transform: rotate(-16deg);
  }
  @keyframes planetFloat{ 50%{ transform: translateY(-10px); } }

  /* spaceship */
  .spaceship{
    position:fixed;
    z-index:0;
    pointer-events:none;
    left:0;
    top:58%;
    width:54px;
    filter: drop-shadow(0 0 8px rgba(255,122,61,.5));
    animation: fly 18s linear infinite;
  }
  .spaceship .flame{
    animation: flameFlicker .5s ease-in-out infinite alternate;
    transform-origin: center;
  }
  @keyframes flameFlicker{
    from{ opacity:.6; transform: scaleY(.85); }
    to{ opacity:1; transform: scaleY(1.1); }
  }
  @keyframes fly{
    0%{ transform: translate(-10vw, 12vh) rotate(-32deg); opacity:0; }
    8%{ opacity:1; }
    50%{ transform: translate(70vw, -38vh) rotate(-18deg); }
    92%{ opacity:1; }
    100%{ transform: translate(130vw, -72vh) rotate(-18deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .stars-1, .stars-2, .moon, .planet, .spaceship, .spaceship .flame{ animation: none; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--cyan), var(--orange2) 60%, var(--orange));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1a0b00;
    font-size:34px;
    font-weight:700;
    box-shadow: 0 0 34px 2px rgba(94,231,255,.35);
    opacity:0;
    transform: translateY(10px) scale(0.9);
    animation: pop-in 0.6s cubic-bezier(.34,1.56,.64,1) 0.05s forwards;
  }

  h1{
    margin: 18px 0 2px;
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(120deg, #fff 20%, var(--cyan) 55%, var(--orange2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.2s forwards;
  }

  .title{
    margin:0;
    font-size:15px;
    font-weight:600;
    color: var(--orange2);
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.32s forwards;
  }

  .bio{
    margin: 12px 0 26px;
    font-size:14.5px;
    line-height:1.5;
    color: var(--dim);
    max-width: 320px;
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.44s forwards;
  }

  @keyframes fade-up{
    to{ opacity:1; transform:none; }
  }
  @keyframes pop-in{
    to{ opacity:1; transform:none; }
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    opacity:0;
    transform: translateY(10px);
    animation: fade-up 0.55s ease-out 0.56s forwards;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    min-height:56px;
    padding: 0 20px;
    border-radius: 999px;
    text-decoration:none;
    font-weight:700;
    font-size:15.5px;
    border:1px solid var(--line);
    box-shadow: 0 10px 26px -12px rgba(0,0,0,.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -10px rgba(94,231,255,.35);
  }

  .link-btn:active{
    transform: scale(0.96);
    box-shadow: 0 4px 10px -6px rgba(0,0,0,.5);
  }

  .link-btn .icon{
    flex-shrink:0;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn.instagram{ background: linear-gradient(135deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); color:#fff; }
  .link-btn.linkedin{ background: linear-gradient(135deg, #0A66C2, #0958a8); color:#fff; }
  .link-btn.behance{ background: linear-gradient(135deg, #1769ff, #0047ab); color:#fff; }

  .be-badge{
    font-weight:800;
    font-size:14px;
    letter-spacing:-0.5px;
  }

  footer{
    margin-top: 30px;
    font-size:12.5px;
    color: var(--dim);
    opacity:0.7;
  }

  @media (min-width: 640px){
    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(6px);
      border-radius: 32px;
      padding: 48px 40px 36px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
    }
  }
</style>
</head>
<body>

  <div class="planet"></div>

    <rect x="20" y="36" width="24" height="14" fill="#f4f1e6"/>

    <path d="M20 40L8 52L20 48Z" fill="#1b1f33"/>
    <path d="M44 40L56 52L44 48Z" fill="#1b1f33"/>

    <footer>made with care, somewhere among the stars ✦</footer>
  </main>

</body>
