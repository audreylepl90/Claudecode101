<style>
  :root{
    --cream:#fff6ef;
    --blush:#ffd9c9;
    --peach:#ffb199;
    --coral:#ff8a73;
    --plum:#5b3a4a;
    --ink:#3f2a34;
    --white:#ffffff;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--cream) 0%, var(--blush) 55%, var(--peach) 100%);
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 18px;
    position:relative;
    overflow-x:hidden;
  }

  /* drifting background blobs for a bit of life */
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(40px);
    opacity:0.45;
    z-index:0;
    pointer-events:none;
  }
  .blob-1{
    width:280px; height:280px;
    background: var(--coral);
    top:-80px; left:-80px;
    animation: drift1 14s ease-in-out infinite;
  }
  .blob-2{
    width:220px; height:220px;
    background: var(--peach);
    bottom:-60px; right:-60px;
    animation: drift2 16s ease-in-out infinite;
  }
  .blob-3{
    width:160px; height:160px;
    background: #ffe1a8;
    top:40%; right:-40px;
    opacity:0.35;
    animation: drift3 12s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(30px, 40px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-25px,-30px) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-20px, 25px); }
  }

  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--coral), #ffb199 60%, #ffd9c9);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--white);
    font-size:34px;
    font-weight:700;
    box-shadow: 0 12px 30px -8px rgba(255,138,115,0.55);
    opacity:0;
    transform: translateY(10px) scale(0.9);
    animation: pop-in 0.6s cubic-bezier(.34,1.56,.64,1) 0.05s forwards;
  }

  h1{
    margin: 18px 0 2px;
    font-size: 26px;
    font-weight: 800;
    color: var(--plum);
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.2s forwards;
  }

  .title{
    margin:0;
    font-size:15px;
    font-weight:600;
    color: var(--coral);
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.32s forwards;
  }

  .bio{
    margin: 12px 0 26px;
    font-size:14.5px;
    line-height:1.5;
    color: var(--ink);
    opacity:0.85;
    max-width: 320px;
    opacity:0;
    transform: translateY(8px);
    animation: fade-up 0.55s ease-out 0.44s forwards;
  }

  @keyframes fade-up{
    to{ opacity:1; transform:none; }
  }
  @keyframes pop-in{
    to{ opacity:1; transform:none; }
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    opacity:0;
    transform: translateY(10px);
    animation: fade-up 0.55s ease-out 0.56s forwards;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    min-height:56px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:15.5px;
    box-shadow: 0 6px 18px -8px rgba(91,58,74,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -10px rgba(91,58,74,0.35);
  }

  .link-btn:active{
    transform: scale(0.96);
    box-shadow: 0 4px 10px -6px rgba(91,58,74,0.3);
  }

  .link-btn .icon{
    flex-shrink:0;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn.whatsapp{ background: linear-gradient(135deg, #25D366, #1fb956); color:#fff; }
  .link-btn.linkedin{ background: linear-gradient(135deg, #0A66C2, #0958a8); color:#fff; }
  .link-btn.instagram{ background: linear-gradient(135deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); color:#fff; }

  footer{
    margin-top: 30px;
    font-size:12.5px;
    color: var(--plum);
    opacity:0.55;
  }

  @media (min-width: 640px){
    .card{
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(6px);
      border-radius: 32px;
      padding: 48px 40px 36px;
      box-shadow: 0 30px 60px -20px rgba(91,58,74,0.25);
    }
  }
</style>
</head>
