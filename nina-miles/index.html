<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nina and Miles Sitter Guide</title>
<style>
:root{--bg:#F5EDE2;--surface:#FFFAF2;--ink:#2B1D14;--muted:#6B5748;--line:#E2D2BE;--miles:#B4491F;--nina:#5A6B3A;--gold:#D9962F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1C1511;--surface:#271D17;--ink:#F4E8D8;--muted:#BBA692;--line:#43342A;--miles:#F08A5A;--nina:#B3C47F;--gold:#E9B04F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;text-align:center}
.paws{display:flex;justify-content:center;gap:10px;font-size:2.2rem;margin-bottom:6px}
.paws svg{width:1em;height:1em;animation:wag 2.4s ease-in-out infinite;transform-origin:50% 80%}
.paws svg:first-child{fill:var(--nina)} .paws svg:last-child{fill:var(--miles);animation-delay:.3s}
h1{font:800 2rem/1.1 "Trebuchet MS",system-ui,sans-serif;margin:8px 0 8px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted)}
form{display:grid;gap:12px}
input{font-weight:700;font-size:1.15rem;font-family:inherit;text-align:center;padding:16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:56px;letter-spacing:.04em}
input:focus{outline:3px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
button{font-weight:700;font-size:1.05rem;font-family:inherit;border:0;border-radius:99px;min-height:56px;padding:14px 22px;background:var(--miles);color:#fff;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-color-scheme:dark){button{color:#1C1511}}
button:hover{transform:translateY(-2px)} button:active{transform:scale(.94)} button[disabled]{opacity:.6}
#msg{min-height:1.5em;margin:12px 0 0;font-weight:700;color:var(--miles)}
.shake{animation:shake .4s}
.fine{margin-top:22px;font-size:.85rem}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<main>

    <svg viewBox="0 0 64 64"><ellipse cx="14" cy="28" rx="7" ry="9"/><ellipse cx="27" cy="16" rx="7" ry="10"/><ellipse cx="42" cy="16" rx="7" ry="10"/><ellipse cx="53" cy="29" rx="7" ry="9"/><path d="M32 30c-9 0-18 10-18 18 0 6 5 9 11 8 3-.5 5-1.5 7-1.5s4 1 7 1.5c6 1 11-2 11-8 0-8-9-18-18-18z"/></svg>
  </div>
  <h1>Nina and Miles</h1>
  <p>This guide is just for our sitter. Enter the code Audrey sent you.</p>

    <button id="go" type="submit">Unlock the guide</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="fine">Having trouble? Message Bel or Suraj.</p>
</main>

  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open_(code){

    var km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},key,b64(P.c));
    return new TextDecoder().decode(buf);
  }
