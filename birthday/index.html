<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation Novakov</title>
<meta name="description" content="A top secret birthday mission for Dr. Novakov. Mission Control awaits.">
<meta name="theme-color" content="#050816">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
:root{
  --bg:#050816; --bg2:#0b1230; --panel:rgba(16,24,58,.72); --line:rgba(140,170,255,.22);
  --moon:#f4f1e6; --orange:#ff7a3d; --orange2:#ffb347; --cyan:#5ee7ff; --text:#e9eeff; --dim:#8fa0d0;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,var(--bg2) 0%,var(--bg) 60%);color:var(--text);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:78px 16px 80px}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}

/* progress bar */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 16px calc(8px);background:linear-gradient(#050816ee,#05081600);backdrop-filter:blur(4px)}
#hud .row{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
#track{max-width:560px;margin:6px auto 0;height:4px;border-radius:4px;background:rgba(140,170,255,.18);position:relative}
#fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--orange));transition:width .9s cubic-bezier(.2,.8,.2,1)}
#hudRocket{position:absolute;top:-9px;left:0;width:22px;transform:translateX(-50%) rotate(90deg);transition:left .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--orange))}

/* hero */
.hero{text-align:center;padding:12px 0 28px;position:relative}
.sky{position:relative;height:220px;margin-bottom:6px}
.moon{position:absolute;left:50%;top:6px;width:130px;height:130px;margin-left:-65px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--moon) 35%,#c9c4b0 100%);
  box-shadow:0 0 50px 8px rgba(244,241,230,.25),0 0 120px 30px rgba(94,231,255,.12);animation:float 7s ease-in-out infinite}
.moon i{position:absolute;border-radius:50%;background:rgba(120,115,95,.28);box-shadow:inset 2px 2px 3px rgba(0,0,0,.18)}
.planet{position:absolute;right:6%;top:96px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd29a,#e0803a 70%);animation:float 9s ease-in-out infinite reverse}
.planet:after{content:"";position:absolute;left:-26px;top:21px;width:110px;height:16px;border:3px solid rgba(255,214,160,.8);border-radius:50%;transform:rotate(-18deg)}
.rocket-hero{position:absolute;left:calc(50% - 82px);bottom:-4px;width:52px;z-index:2;filter:drop-shadow(12px 4px 9px rgba(0,0,0,.75));animation:hover 3.2s ease-in-out infinite}
.pl{position:absolute;border-radius:50%;animation:float 8s ease-in-out infinite}
.pl.r:after{content:"";position:absolute;left:-45%;top:38%;width:190%;height:24%;border:2px solid rgba(220,200,255,.75);border-radius:50%;transform:rotate(-20deg)}
.ghost{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;color:var(--cyan);text-decoration:none;border:1px solid var(--line);background:rgba(94,231,255,.07);border-radius:12px;padding:10px 16px;transition:transform .12s,background .2s}
.ghost:hover{background:rgba(94,231,255,.16)}.ghost:active{transform:scale(.95)}
button.ghost{box-shadow:none;color:var(--cyan);background:rgba(94,231,255,.07)}
.place{margin-top:12px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--dim)}.place b{color:var(--text);font-size:16px}
.map{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.map iframe{display:block;width:100%;height:210px;border:0}
.apollo{margin:4px 0 10px;text-align:center}
.apollo svg{width:100%;max-width:340px;height:auto}
.lm{animation:land 2.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes land{from{transform:translateY(-70px)}}
.apollo .cap{font-size:11px;color:var(--cyan)}
.sat{position:absolute;left:8%;top:40px;width:20px;height:20px;animation:orbit 12s linear infinite}
.sat:before{content:"✦";color:var(--cyan);font-size:18px;text-shadow:0 0 10px var(--cyan)}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes hover{50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes orbit{0%{transform:translate(0,0)}25%{transform:translate(40px,22px)}50%{transform:translate(80px,0)}75%{transform:translate(40px,-22px)}100%{transform:translate(0,0)}}
.badge{display:inline-block;font-size:11px;color:var(--cyan);border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:rgba(94,231,255,.07)}
h1{font-size:clamp(34px,10vw,52px);line-height:1.04;margin:14px 0 8px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(120deg,#fff 20%,var(--cyan) 55%,var(--orange2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);max-width:420px;margin:0 auto 18px}
#countdown{font-size:13px;color:var(--orange2);margin-bottom:20px;min-height:20px}

/* buttons */
button{font:inherit;cursor:pointer;border:0;color:#1a0b00;font-weight:700;border-radius:14px;padding:14px 20px;
  background:linear-gradient(135deg,var(--orange2),var(--orange));box-shadow:0 6px 24px rgba(255,122,61,.35);
  transition:transform .12s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
button:hover{filter:brightness(1.08);box-shadow:0 8px 30px rgba(255,122,61,.5)}
button:active{transform:scale(.94)}
button .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.big{font-size:17px;padding:16px 30px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0;backdrop-filter:blur(6px);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.05) 50%,transparent 60%);transform:translateX(-100%);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--cyan);margin-bottom:6px}
.card h2{margin:2px 0 8px;font-size:22px}
.card p{margin:8px 0}
.riddle{border-left:3px solid var(--orange);padding:4px 0 4px 12px;color:#dfe6ff}
.opt{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px dashed var(--line)}
.opt b{color:var(--orange2)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-align:center;color:var(--text);
  background:rgba(5,8,22,.7);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(94,231,255,.18)}
input::placeholder{color:#5a6a9a;letter-spacing:.05em;font-size:14px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.err{min-height:20px;margin-top:8px;font-size:13px;color:#ff9b8a}
.ok{border-color:rgba(94,231,255,.5);box-shadow:0 0 30px rgba(94,231,255,.12)}
.brief{background:rgba(94,231,255,.07);border:1px solid rgba(94,231,255,.28);border-radius:12px;padding:12px;margin-top:12px}
.brief .mono{font-size:11px;color:var(--cyan);margin-bottom:4px}
.locked{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin:10px 0;border:1px dashed var(--line);border-radius:14px;color:#5f70a3;font-size:12px;opacity:.8}
.msg{font-size:19px;font-weight:600;line-height:1.5;text-align:center;padding:6px 0}
.msg em{font-style:normal;color:var(--orange2)}
.cmd{display:flex;gap:14px;align-items:center}
.avatar{flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:#1a0b00;background:linear-gradient(135deg,var(--cyan),var(--orange2));box-shadow:0 0 24px rgba(94,231,255,.4)}
footer{text-align:center;color:#5f70a3;font-size:12px;margin-top:30px}
button.mini{margin-top:14px;padding:7px 14px;font-size:11px;font-weight:600;border-radius:10px;color:var(--dim);background:transparent;border:1px solid var(--line);box-shadow:none;letter-spacing:.08em;text-transform:uppercase}
button.mini:hover{color:var(--cyan);box-shadow:none}

/* launch overlay */
#launch{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
#launch.go{display:block}
#launch svg{position:absolute;left:50%;bottom:-120px;width:70px;margin-left:-35px;animation:blast 1.4s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes blast{to{transform:translateY(-120vh)}}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none;width:100%;height:100%}

@media(min-width:760px){
  main{padding-top:96px}
  .sky{height:260px}.moon{width:160px;height:160px;margin-left:-80px}
  .card{padding:24px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="launch" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="saturn" viewBox="0 0 40 140">
      <path d="M20 2 C24 14 26 22 26 30 L14 30 C14 22 16 14 20 2Z" fill="#f4f1e6"/>
      <rect x="14" y="30" width="12" height="34" fill="#f4f1e6"/>
      <rect x="14" y="40" width="12" height="7" fill="#1b1f33"/>
      <rect x="14" y="64" width="12" height="3" fill="#8a8f9e"/>
      <rect x="12" y="67" width="16" height="42" fill="#f4f1e6"/>
      <rect x="12" y="76" width="16" height="7" fill="#1b1f33"/>
      <rect x="12" y="92" width="16" height="7" fill="#1b1f33"/>
      <path d="M12 96 L2 120 L12 112Z M28 96 L38 120 L28 112Z" fill="#1b1f33"/>
      <rect x="12" y="109" width="16" height="10" fill="#9aa0b4"/>
      <path d="M13 119 L27 119 L24 128 L16 128Z" fill="#555b72"/>
      <path class="fl" d="M16 128 Q20 148 24 128Z" fill="#ff7a3d"/>
    </symbol>
  </defs>
</svg>

<div id="hud">
  <div class="row mono"><span>Mission Control</span><span id="pct">T+00%</span></div>
  <div id="track"><div id="fill"></div>
    <svg id="hudRocket" viewBox="0 0 40 140"><use href="#saturn"/></svg>
  </div>
</div>

<main id="app"></main>

<script>
"use strict";
/* ============ SETTINGS (edit here) ============ */
const HOTEL_POSTAL = "";          // <- put the hotel's 6-digit postal code here once booked, e.g. "199018"
const HOTEL_NAME   = "";          // <- hotel name, e.g. "Hotel Boss" (shown on the map card)
const HOTEL_ADDRESS= "";          // <- hotel street address, e.g. "38 Jalan Sultan"
const MISSION_DATE = "2026-11-08T09:00:00+08:00";
const MASTER_CODE  = "AUDREY";    // Audrey's override: unlocks the current chapter if a postal code is ever wrong
/* =============================================== */

const cy=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const H=cy;
const norm=s=>String(s).toUpperCase().replace(/^SINGAPORE|^S(?=\d)/,"").replace(/[^A-Z0-9]/g,"");
const HOTEL=H(norm(HOTEL_POSTAL||"HOTEL"));

/* Each chapter: codes = hashed postal codes. Several codes can unlock one chapter (forks / alternates). */
const P=(place,addr)=>({place,addr,map:`${place}, ${addr}`});
const HP=(HOTEL_NAME||HOTEL_ADDRESS||HOTEL_POSTAL)?{place:HOTEL_NAME||"Your hotel",addr:[HOTEL_ADDRESS,HOTEL_POSTAL&&"Singapore "+HOTEL_POSTAL].filter(Boolean).join(", "),
  map:[HOTEL_NAME,HOTEL_ADDRESS,HOTEL_POSTAL&&"Singapore "+HOTEL_POSTAL].filter(Boolean).join(", ")}:{};
const CHAPTERS=[
 {t:"09:00",title:"Fuel Up",
  riddle:"Every great mission starts with fuel. Today's is brewed by roasters who flipped their cafe upside down and moved house. The name is small enough to fit in your pocket, but the coffee is not. It's close to where you're sleeping.",
  codes:[{h:[5041104632260185,7194005047419964],...P("Pocket by Flip Coffee Roasters","30 Stevens Road, #01-08, Singapore 257840"),brief:"Fuel tanks filling. Order a coffee, or two. Engines don't start themselves, and neither does Steve before caffeine.",tag:"Coffee loaded"}]},
 {t:"10:00",title:"Fork in the Trajectory",
  riddle:null,
  options:[
   "<b>Plan A (clear skies):</b> Mud, mangroves and reptiles that have been smiling at visitors since the dinosaurs. A wetland reserve in the far north-west of the island. (Locals say crocodile, Mission Control says alligator. Don't correct them to their face.)",
   "<b>Plan B (haze override):</b> A wooden wave bridge floating 36 metres above a road, on the green Southern Ridges. More trees, less haze, still very photogenic."],
  codes:[
   {h:[5803341409188061],...P("Sungei Buloh Wetland Reserve","301 Neo Tiew Crescent, Singapore 718925"),brief:"Plan A engaged. Bring water, a hat and your best 'I am not afraid of reptiles' face. Smile, the alligators will. And when it's time to go, you know the drill: <b>See you later, alligator!</b> The correct reply is 'In a while, crocodile.' (Technically accurate here.)",tag:"Plan A · Wetland"},
   {h:[6963489889869195,5502617799319853],...P("Henderson Waves","Henderson Road, Singapore 159557"),brief:"Plan B engaged. Fresher air, a wavy bridge, and zero alligators. Disappointing, but the lungs say thank you. Nobody to say 'See you later, alligator' to, so wave at a tree instead.",tag:"Plan B · Henderson Waves"}]},
 {t:"13:00",title:"Refuelling Stop",
  riddle:"A nut that people once burned like a candle, now cooked into traditional dishes the way Nonya grandmas make them. It sits on a leafy hill that used to house soldiers, and the food has the stars to prove it. Dress like you meant to look this good.",
  codes:[{h:[4253631133550936],...P("Candlenut","17A Dempsey Road, Singapore 249676"),brief:"Touchdown confirmed. Expect rich, hearty dishes with bold, vibrant flavours and a rainbow of colours on the table. Eat with your eyes first. Every dish goes in the middle and gets shared, so everyone gets a taste of everything.",tag:"Lunch unlocked"}]},
 {t:"14:30",title:"Cabin Cooldown",
  riddle:"Back to the habitat module for a rest. Air conditioning set to Arctic, curtains closed, shoes off. Enter the postal code of your home base on this mission, the place where you sleep.",
  codes:[{h:[HOTEL],...HP,brief:"Habitat reached. Air-conditioning: ON. Steve's systems: recharging. Please do not disturb the astronaut (unless there is snacking).",tag:"Rest · Hotel"}]},
 {t:"16:00",title:"Splashdown",ph:"Secret word",
  riddle:"Zero gravity is unavailable today, so Mission Control offers the next best thing: water. This chapter needs a secret word, not a postal code. Four letters, it's the thing you jump into at the hotel to cool off.",
  codes:[{h:[65857791971311],...HP,brief:"Splashdown confirmed. Swim, float, repeat. Racing is allowed here, since nothing has wheels. Bring a towel.",tag:"Pool · Hotel"}]},
 {t:"19:30",title:"Ignition",
  riddle:"Smoke, sizzle, sauces and sides. Tonight you're the grill master: dinner you cook yourselves, over real fire. Every fire alarm in the neighbourhood is nervous.",
  codes:[{h:[322463758418763],...P("Um Yong Baek","27 Boon Tat Street, Singapore 069623"),brief:"Ignition sequence started. Grills are hot. Rule: whoever flips the meat wears the apron. (Mission Control suggests Steve.)",tag:"Dinner unlocked"}]},
 {t:"21:00",title:"Sweet Orbit",
  riddle:"Dessert planet: something cold, creamy and sweet, because dinner is never the final stage. Small portion, huge happiness. Mission Control insists.",
  codes:[{h:[8324979989525906],...P("Tofu G","97 Amoy Street, Singapore 069916"),brief:"Sweet orbit reached. Gravity is optional, dessert is not. Order the one you can't pronounce.",tag:"Dessert unlocked"}]},
 {t:"22:00",title:"Moon Landing",
  riddle:"The final stage. A grand old museum with a rooftop that gives you the best skyline view of the city and the bay, lit up like a launch pad at night. Moon landing in 3, 2, 1...",
  codes:[{h:[5102873824469740],...P("National Gallery Singapore","1 St Andrew's Road, Singapore 178957"),brief:"The Eagle has landed. The skyline is the star of tonight's show, with the city lights and the bay glittering below. Have a drink or two, but let the view do the talking.",tag:"Rooftop reached",final:true}]}
];

const WRONG=[
 "Houston, we have a problem. Try again.",
 "Wrong coordinates. Even a MotoGP rider checks the map first.",
 "Nope. Steve wouldn't ride a motorbike on a public road, but he'd still get the postal code right. Try again.",
 "Signal lost. No spaces, please. Check the riddle again!",
 "That's not it, Commander. Re-read the clue."
];

let state={started:false,done:[]};   // done[i] = index of code used for chapter i
try{ if(location.search.includes("reset")) localStorage.removeItem("novakov"); const s=JSON.parse(localStorage.getItem("novakov")||"null"); if(s&&Array.isArray(s.done)) state=s; }catch(e){}
const save=()=>{try{localStorage.setItem("novakov",JSON.stringify(state))}catch(e){}};

const $=s=>document.querySelector(s);
const app=$("#app");
const rocket=`<svg viewBox="0 0 40 140" width="100%" aria-hidden="true"><use href="#saturn"/></svg>`;

function render(animateIdx){
  const n=CHAPTERS.length, prog=state.done.length;
  let html=`
  <section class="hero">
    <div class="sky">
      <div class="moon"><i style="left:22%;top:28%;width:22px;height:22px"></i><i style="left:58%;top:18%;width:14px;height:14px"></i><i style="left:50%;top:55%;width:30px;height:30px"></i><i style="left:20%;top:64%;width:12px;height:12px"></i></div>
      <div class="planet"></div><div class="sat"></div>
      <div class="pl" style="left:5%;top:18px;width:14px;height:14px;background:radial-gradient(circle at 30% 30%,#b9dcff,#3d7be0)"></div>
      <div class="pl" style="left:16%;top:118px;width:22px;height:22px;background:radial-gradient(circle at 30% 30%,#ff9a7e,#b8351f);animation-delay:-2s"></div>
      <div class="pl r" style="right:24%;top:14px;width:16px;height:16px;background:radial-gradient(circle at 30% 30%,#e3d1ff,#8a5fd6);animation-delay:-4s"></div>
      <div class="pl" style="right:3%;top:44px;width:10px;height:10px;background:radial-gradient(circle at 30% 30%,#b8fff0,#1fae9a);animation-delay:-1s"></div>
      <div class="pl" style="left:31%;top:6px;width:9px;height:9px;background:radial-gradient(circle at 30% 30%,#fff7c2,#e8c34a);animation-delay:-3s"></div>
      <div class="pl" style="right:30%;top:150px;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#d9ffb8,#5fb43a);animation-delay:-5s"></div>
      <div class="pl r" style="left:3%;top:84px;width:11px;height:11px;background:radial-gradient(circle at 30% 30%,#ffe6b8,#d19a3a);animation-delay:-6s"></div>
      <div class="rocket-hero">${rocket}</div>
    </div>
    <span class="badge mono">Top secret · Birthday mission</span>
    <h1>Operation<br>Novakov</h1>
    <p class="sub">Happy birthday, <b>Dr. Novakov</b>! Mission Control has one day, eight chapters and one co-pilot. Solve each clue, enter the postal code of the destination, and the next chapter unlocks.</p>
    <div id="countdown" class="mono"></div>
    ${state.started?"":`<button class="big" id="begin">Begin mission 🚀</button>`}
  </section>`;
  if(state.started){
    for(let i=0;i<n;i++){
      const c=CHAPTERS[i];
      if(i<prog){
        const cd=c.codes[state.done[i]]||c.codes[0];
        html+=`<article class="card ok" ${i===animateIdx?"":'style="animation:none"'}>
          <div class="meta mono"><span>Chapter ${i+1}</span><span>T+${c.t}</span></div>
          <h2>${c.title}</h2>
          <div class="brief"><div class="mono">✓ ${cd.tag}</div>${cd.brief}</div>
          ${placeHtml(cd)}${mapHtml(cd,i===prog-1)}
        </article>`;
        if(cd.final) html+=finale();
      }else if(i===prog){
        html+=`<article class="card" id="cur">
          <div class="meta mono"><span>Chapter ${i+1} · incoming</span><span>T+${c.t}</span></div>
          <h2>${c.title}</h2>
          ${c.riddle?`<p class="riddle">${c.riddle}</p>`:c.options.map(o=>`<div class="opt">${o}</div>`).join("")+`<p class="riddle">Audrey will tell you which one. Type the postal code of the chosen destination.</p>`}
          <form id="f" autocomplete="off"><input id="code" inputmode="text" autocapitalize="characters" placeholder="${c.ph||'Postal code'}" aria-label="${c.ph||'Postal code'}" maxlength="12"><button type="submit">Unlock</button></form>
          <div class="err" id="err" role="status"></div>
        </article>`;
      }else{
        html+=`<div class="locked mono"><span>Chapter ${i+1} · encrypted</span><span>🔒 T+${c.t}</span></div>`;
      }
    }
  }
  html+=`<footer class="mono">Made with ♥ by Audrey · Mission Control${state.started?`<br><button class="mini" id="restart" type="button">↺ Restart mission</button>`:""}</footer>`;
  app.innerHTML=html;
  bind(); tick(); updateHud();
}

function finale(){
  return `<article class="card ok">
    <div class="meta mono"><span>Final transmission</span><span>★</span></div>
    ${apollo()}
    <div class="msg">Happy birthday, <em>Dr. Novakov</em>! 🎂<br><br>You've just completed another full orbit around the Sun (about 940 million km) and you still haven't hit terminal velocity.<br><br>Thank you for a wonderful adventure so far, here is to many more.<br><br>Newton's first law says an object in motion stays in motion, so Audrey is keeping you moving. Hope you enjoyed the alligators and a day fueled with good food. Results: time is relative, calories are conserved, and dessert has infinite gravitational pull. 🌙</div>
  </article>
  <article class="card">
    <div class="cmd"><div class="avatar">A</div>
      <div><div class="mono" style="color:var(--cyan);font-size:11px">Mission Commander</div>

      <div style="color:var(--dim);font-size:14px">Real estate ops manager by day, sports, travel and culture lover by night. Today she pointed all those project-management skills at one very fun mission, with you as her co-pilot. Occupational hazard, for sure: even the fun comes with a timeline.</div></div></div>

function placeHtml(cd){
  return cd.place?`<div class="place"><b>📍 ${cd.place}</b><span>${cd.addr}</span></div>`:"";
}

function mapHtml(cd,embed){
  if(!cd.map) return "";
  const q=encodeURIComponent(cd.map);
  return (embed?`<div class="map"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map of the destination" src="https://maps.google.com/maps?q=${q}&z=16&output=embed"></iframe></div>`:"")
    +`<a class="ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">📍 Open in Google Maps</a>`;
}

function bind(){
  const rs=$("#restart");
  if(rs) rs.onclick=()=>{ if(confirm("Restart the mission from the very beginning?")){ state={started:false,done:[]}; save(); render(); scrollTo({top:0,behavior:"smooth"}); } };
  const b=$("#begin");
  if(b) b.onclick=()=>{state.started=true;save();render();setTimeout(()=>$("#cur")?.scrollIntoView({behavior:"smooth",block:"center"}),150)};
  const f=$("#f");
  if(f){
    f.onsubmit=e=>{
      e.preventDefault();
      const v=norm($("#code").value), i=state.done.length, c=CHAPTERS[i];
      if(!v) return;
      let idx=-1;
      if(v===MASTER_CODE) idx=0;
      else c.codes.forEach((cd,k)=>{ if(cd.h.includes(H(v))) idx=k; });
      if(idx<0){
        const card=$("#cur"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
        $("#err").textContent=WRONG[Math.floor(Math.random()*WRONG.length)];
        return;
      }
      state.done.push(idx); save();
      launch();
      setTimeout(()=>{render(i); if(c.codes[idx].final) confetti(); document.querySelectorAll(".card")[Math.min(i,document.querySelectorAll(".card").length-1)]?.scrollIntoView({behavior:"smooth",block:"center"}); },900);
    };
  }
}

/* ripple on buttons */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height), d=document.createElement("span");
  d.className="rip"; d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(d); setTimeout(()=>d.remove(),650);
});

function launch(){
  const l=$("#launch"); l.innerHTML=rocket; l.classList.remove("go"); void l.offsetWidth; l.classList.add("go");
  setTimeout(()=>l.classList.remove("go"),1500);
}

function updateHud(){
  const p=Math.round(state.done.length/CHAPTERS.length*100);
  $("#fill").style.width=p+"%"; $("#hudRocket").style.left="max(11px,"+p+"%)"; $("#pct").textContent="T+"+String(p).padStart(2,"0")+"%";
}

function tick(){
  const el=$("#countdown"); if(!el) return;
  const ms=new Date(MISSION_DATE)-Date.now();
  if(ms>0){
    const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60;
    el.textContent=`T-minus ${d}d ${h}h ${m}m to launch`;
  }else el.textContent="Mission is live. Godspeed!";
}
setInterval(tick,30000);

/* ===== starfield ===== */
const cv=$("#stars"), cx=cv.getContext("2d");
let W,Hh,stars=[],shots=[],dpr=1,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){
  dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; Hh=innerHeight;
  cv.width=W*dpr; cv.height=Hh*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.round(Math.min(160,W*Hh/6500));
  stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*Hh,r:Math.random()*1.4+.3,z:Math.random()*.6+.2,p:Math.random()*6.28,s:Math.random()*1.5+.5}));
}
function frame(t){
  cx.clearRect(0,0,W,Hh);
  const sy=scrollY;
  for(const s of stars){
    const a=.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));
    const y=((s.y-sy*s.z*.15)%Hh+Hh)%Hh;
    cx.globalAlpha=reduce?.7:a; cx.fillStyle=s.r>1.3?"#bff3ff":"#fff";
    cx.beginPath(); cx.arc(s.x,y,s.r,0,6.28); cx.fill();
  }
  if(!reduce&&Math.random()<.004&&shots.length<2) shots.push({x:Math.random()*W,y:Math.random()*Hh*.5,l:0});
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i]; s.l+=1; s.x+=9; s.y+=4;
    const g=cx.createLinearGradient(s.x,s.y,s.x-90,s.y-40); g.addColorStop(0,"rgba(255,255,255,.9)"); g.addColorStop(1,"rgba(255,255,255,0)");
    cx.globalAlpha=1; cx.strokeStyle=g; cx.lineWidth=2; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-90,s.y-40); cx.stroke();
    if(s.l>60) shots.splice(i,1);
  }
  cx.globalAlpha=1;
  if(!document.hidden && !reduce) requestAnimationFrame(frame);
}
addEventListener("resize",()=>{size();if(reduce)frame(0)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!reduce)requestAnimationFrame(frame)});
size(); requestAnimationFrame(frame);

/* ===== confetti ===== */
function confetti(){
  const c=$("#confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#ff7a3d","#ffb347","#5ee7ff","#fff","#f4f1e6"];
  const ps=Array.from({length:reduce?0:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,s:Math.random()*7+3,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;
  (function run(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<260) requestAnimationFrame(run); else x.clearRect(0,0,c.width,c.height);
  })();
}

render();
